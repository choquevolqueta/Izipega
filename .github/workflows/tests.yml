name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Preparar perfil de prueba (perfil.json es gitignored)
        run: cp perfil.json.template perfil.json

      - name: Correr tests
        run: pytest -v
